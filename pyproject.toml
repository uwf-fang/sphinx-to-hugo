[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-to-hugo-pilot"
version = "0.1.0"
description = "Research pilot: Sphinx-resolved Markdown with Hugo migration metadata"
requires-python = ">=3.10"
dependencies = ["Sphinx==8.1.3", "sphinx-markdown-builder==0.6.11", "tabulate==0.9.0"]

[project.optional-dependencies]
project-migration = ["myst-parser==4.0.1"]

[project.scripts]
sphinx-to-hugo = "sphinx_to_hugo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
